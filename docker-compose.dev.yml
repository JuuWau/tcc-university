version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile.dev
    container_name: laravel_app_dev
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8001
      - DB_CONNECTION=pgsql
      - DB_HOST=db 
      - DB_PORT=5432
      - DB_DATABASE=laravel_dev
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret
    volumes:
      - ./docker:/var/www/html/docker
      - .:/var/www/html
      - /var/www/html/node_modules
      - /var/www/html/vendor
    depends_on:
      - db
    networks:
      - laravel-network-dev

  db:
    image: postgres:16
    container_name: laravel_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel_dev
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    networks:
      - laravel-network-dev

  pgadmin:
    image: dpage/pgadmin4
    container_name: laravel_pgadmin_dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8082:80"
    depends_on:
      - db
    networks:
      - laravel-network-dev

  node:
    image: node:22
    container_name: laravel_node_dev
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: npm run dev
    ports:
      - "5173:5173"
    networks:
      - laravel-network-dev

networks:
  laravel-network-dev:
    driver: bridge

volumes:
  db_data_dev: